---
# cPanel Git deployment configuration.
# The Git repository is also the Node.js application root, so no file-copy
# step is needed. Restart the Node.js application from Setup Node.js App
# after deployment if the running process does not reload automatically.
deployment:
  tasks:
    - /bin/echo "MovieStream BD: triggering Node.js restart..."
    - /bin/mkdir -p tmp
    - /bin/touch tmp/restart.txt
