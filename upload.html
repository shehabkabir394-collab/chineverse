<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Upload — CineVerse 4K</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/config.js"></script><script defer src="js/upload.js"></script></head><body><header class="topbar"><a class="brand" href="./"><span class="mark">C</span>CineVerse <b>4K</b></a><nav><a href="./">Home</a><a href="live-tv.html">Live TV</a><a href="upload.html">Community Upload</a><a href="community-admin.html">Moderation</a></nav></header><main class="admin"><div class="center"><p class="eyebrow">COMMUNITY STUDIO</p><h1>Share a <em>Video</em></h1><p class="muted">Sign in, upload your own video, and wait for admin approval before it appears to viewers.</p></div><section class="panel narrow"><form id="authForm" class="form"><h2>Account</h2><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><div class="row"><button class="btn primary" id="signIn">Sign in</button><button class="btn ghost" id="signUp" type="button">Create account</button></div><button class="btn ghost hidden" id="signOut" type="button">Sign out</button><p id="authMsg" class="msg" aria-live="polite"></p></form></section><section id="uploadPanel" class="panel narrow hidden" style="margin-top:20px"><form id="uploadForm" class="form"><h2>Submit your video</h2><label>Video title<input id="title" maxlength="180" required></label><label>Description<textarea id="description" rows="3" maxlength="2000"></textarea></label><label>Video file (MP4, WebM or MOV; max 500 MB)<input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime" required></label><button class="btn primary">Upload for review</button><p id="uploadMsg" class="msg" aria-live="polite"></p></form><h2>Your submissions</h2><div id="myVideos" class="admin-list">Loading…</div></section></main><footer><a class="brand" href="./">CineVerse <b>4K</b></a></footer></body></html>
