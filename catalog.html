<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050711">
  <meta name="description" content="Browse all MovieStream BD movies and dramas by category, language and A–Z.">
  <title>All Movies &amp; Dramas — MovieStream BD</title>
  <link rel="stylesheet" href="css/style.css?v=20261124-90hz-3">
  <link rel="stylesheet" href="css/movie-api.css?v=20261124-90hz-3">
  <link rel="stylesheet" href="css/movie-api-catalog.css?v=20261124-90hz-3">
  <link rel="stylesheet" href="css/cineverse-app-redesign.css?v=20261124-90hz-3">
  <link rel="stylesheet" href="css/movie-api-account.css?v=20261124-90hz-3">
  <link rel="stylesheet" href="css/liquid-glass-theme.css?v=20261124-90hz-3">
  <script defer src="js/movie-api-catalog.js?v=20261124-90hz-3"></script>
  <script defer src="js/movie-api-discovery.js?v=20261124-90hz-3"></script>
  <script defer src="js/movie-api-account.js?v=20261124-90hz-3"></script>
</head>
<body class="cv-home-body">
  <header class="cv-topbar">
    <div class="cv-topbar-inner">
      <a class="cv-brand-link" href="./" aria-label="MovieStream BD Home">
        <span class="cv-brand-mark" aria-hidden="true">
          <svg width="28" height="24" viewBox="0 0 40 34" fill="none">
            <path d="M5 25C2 22 2 13 8 7C13 2 24 1 32 4C36 6 37 13 35 20C32 27 25 31 16 31C10 31 7 28 5 25Z" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M9 8L12 6M15 4.5L19 3.5M23 3.5L27 4M8 25L11 27.5M15 29L19 29.5M23 29L27 27" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
            <rect x="11" y="8" width="18" height="17" rx="4" fill="#070b14" stroke="#fca5a5" stroke-width="1.8"/>
            <path d="M17 12.2L25.5 16.5L17 20.8Z" fill="#fca5a5"/>
          </svg>
        </span>
        <span class="cv-brand-wordmark">MovieStream<b>BD</b></span>
      </a>

      <form class="cv-search-trigger-form" action="catalog.html" method="get" role="search">
        <span class="cv-search-icon-prefix" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input id="siteGlobalSearch" name="q" type="search" placeholder="মুভি বা সিরিজ খুঁজুন…" aria-label="Search movies or series" autocomplete="off">
        <button class="cv-search-submit-btn" type="submit" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </form>

      <div class="cv-header-actions">
        <a class="cv-header-action-link cv-desktop-only" href="sports.html">Live Sports</a>
        <a class="cv-header-action-link cv-desktop-only" href="saved.html">My List</a>
      </div>
    </div>
  </header>

  <main class="catalog-page" style="max-width:1360px;margin:0 auto;padding:18px 16px 96px">
    <section class="catalog catalog-api-page" style="background:transparent;border:0;padding:0">
      <div class="section-head" style="margin-bottom:14px">
        <div>
          <h1 id="catalogHeading" style="font-family:var(--cv-font-display);margin:0 0 4px">All Movies &amp; Dramas A–Z</h1>
          <p class="muted" style="margin:0;color:var(--cv-text-muted)">Select a category, filter by language/genre, or browse alphabetically.</p>
        </div>
        <button id="catalogRefresh" class="cv-action-btn" type="button">↻ Refresh</button>
      </div>
      <div class="catalog-nav-title">CATEGORIES</div>
      <nav id="catalogCategories" class="catalog-category-nav" aria-label="Movie categories"><a class="catalog-chip active" href="catalog.html">ALL A–Z</a></nav>
      <div class="catalog-nav-title">BROWSE A–Z</div>
      <nav id="catalogAZ" class="catalog-az-nav" aria-label="Browse titles alphabetically"></nav>
      <div class="movie-api-tools" style="display:flex;flex-wrap:wrap;gap:10px;margin:14px 0">
        <select id="catalogLanguageFilter" class="cv-select" aria-label="Filter language"><option value="">All languages</option></select>
        <select id="catalogTypeFilter" class="cv-select" aria-label="Filter type"><option value="">All types</option></select>
        <select id="catalogGenreFilter" class="cv-select" aria-label="Filter genre"><option value="">All genres</option></select>
        <input id="catalogSearch" type="search" placeholder="Filter current catalog…" aria-label="Filter titles" style="flex:1 1 200px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--cv-border-strong);background:var(--cv-surface);color:#fff">
        <button id="catalogSearchButton" class="cv-action-btn" type="button" style="background:var(--cv-accent-grad);border-color:rgba(252,165,165,.45)">Filter</button>
      </div>
      <div id="catalogSearchHistory" class="cv-catalog-history-bar" hidden></div>
      <div id="catalogStatus" class="cv-status-banner" aria-live="polite">Loading catalog…</div>
      <div id="catalogGrid" class="grid"></div>
      <nav id="catalogPager" class="catalog-pagination" aria-label="Catalog pages"></nav>
    </section>
  </main>

  <footer class="cv-footer">
    <span>MovieStream BD · Complete Catalog</span>
    <div style="display:flex;gap:16px">
      <a href="./">Home</a>
      <a href="sports.html">Live Sports</a>
      <a href="privacy.html">Privacy</a>
    </div>
  </footer>

  <nav class="cv-bottom-bar" aria-label="App navigation">
    <a class="cv-bottom-item" href="./">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a class="cv-bottom-item active" href="catalog.html">
      <span class="cv-bottom-tag">HOT</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <span>Explore</span>
    </a>
    <a class="cv-bottom-center" href="sports.html" aria-label="Live Sports">
      <span class="cv-bottom-center-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </span>
      <span>Sports</span>
    </a>
    <a class="cv-bottom-item" href="saved.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Downloads</span>
    </a>
    <button type="button" class="cv-bottom-item" data-open-me>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Me</span>
    </button>
  </nav>
</body>
</html>
