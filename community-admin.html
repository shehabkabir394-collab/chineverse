<main class="admin"><div class="center"><p class="eyebrow">CINEVERSE 4K • ADMIN ONLY</p><h1>Community <em>Control</em></h1><p class="muted">Manage CineVerse community videos and live channels.</p></div><section class="panel narrow"><form id="login" class="form"><label>Admin email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary">Sign in</button><p id="msg" class="msg"></p></form></section><section id="dashboard" class="hidden"><div class="toolbar"><h2>Pending video submissions</h2><button id="logout" class="btn ghost">Sign out</button></div><div id="pending" class="admin-list"></div><section class="panel" style="margin-top:25px"><h2>Publish a Live TV channel</h2><form id="channelForm" class="form"><label>Channel name<input id="channelName" required maxlength="120"></label><div class="row"><label>Category<input id="channelCategory" value="General"></label><label>Stream type<select id="streamType"><option value="hls">HLS (.m3u8)</option><option value="mp4">MP4</option><option value="embed">External link</option></select></label></div><label>Authorized stream HTTPS URL<input id="streamUrl" type="url" required></label><label>Logo HTTPS URL<input id="logoUrl" type="url"></label><label>Description<input id="channelDescription"></label><label class="check"><input id="publishChannel" type="checkbox"> Publish immediately</label><button class="btn primary">Save channel</button><p id="channelMsg" class="msg"></p></form><h3>Existing channels</h3><div id="channels" class="admin-list"></div></section></section></main>
