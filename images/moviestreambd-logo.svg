<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 116" role="img" aria-labelledby="msLogoTitle">
  <title id="msLogoTitle">MovieStream BD — Watch, Stream, Enjoy</title>
  <defs>
    <linearGradient id="msRedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b4e"/>
      <stop offset="100%" stop-color="#dc142c"/>
    </linearGradient>
    <linearGradient id="msFilmRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#ff3b4e"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <g transform="translate(12, 16)">
    <!-- Outer film-strip loop silhouette matching clean minimal brand mark -->
    <path d="M12 68 C4 62 4 38 18 22 C31 7 58 2 76 12 C86 18 89 34 83 52 C77 68 62 79 41 79 C26 79 18 74 12 68 Z" fill="none" stroke="url(#msFilmRim)" stroke-width="5" stroke-linecap="round"/>
    <!-- Film sprocket dashes along top & bottom curve -->
    <path d="M22 25 L29 19 M37 14 L46 11 M55 10 L65 11 M73 16 L78 23 M18 65 L25 71 M33 74 L43 75 M52 74 L61 70 M69 64 L75 56" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.92"/>
    <!-- Rounded inner film frame -->
    <rect x="24" y="21" width="42" height="40" rx="9" fill="#0b0d12" stroke="url(#msRedGrad)" stroke-width="3.2"/>
    <!-- Crisp centered Play Triangle -->
    <path d="M39 30.5 L57 41 L39 51.5 Z" fill="url(#msRedGrad)"/>
  </g>

  <!-- Minimal vertical divider -->
  <line x1="116" y1="20" x2="116" y2="96" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>

  <!-- Wordmark: White MovieStream + Crimson BD -->
  <text x="134" y="62" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#ffffff">MovieStream</tspan><tspan fill="#ef4444" font-weight="900">BD</tspan>
  </text>

  <!-- Minimal tagline bar -->
  <line x1="136" y1="84" x2="184" y2="84" stroke="rgba(255,255,255,0.34)" stroke-width="1.5" stroke-linecap="round"/>
  <text x="196" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.6" fill="#cbd5e1">Watch</text>
  <circle cx="255" cy="83.5" r="2.8" fill="#ef4444"/>
  <text x="268" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.6" fill="#cbd5e1">Stream</text>
  <circle cx="337" cy="83.5" r="2.8" fill="#ef4444"/>
  <text x="350" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.6" fill="#cbd5e1">Enjoy</text>
  <line x1="406" y1="84" x2="466" y2="84" stroke="rgba(255,255,255,0.34)" stroke-width="1.5" stroke-linecap="round"/>
</svg>